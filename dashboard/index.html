<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gastos da Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EFF2F0; --surface:#FFFFFF; --surface-2:#E7ECE9;
  --ink:#101E1C; --muted:#556660; --rule:#D3DBD7; --rule-soft:#E1E7E4;
  --accent:#0E4C51; --bar:#0E9AA0;
  /* tres series, validadas para daltonismo e contraste nos dois modos */
  --entrada:#1B8F7A; --saida:#C25A2E; --investimento:#4A3AA7;
  --alerta:#B4531F; --grid:#C9D3CE;
  --shadow:0 1px 2px rgba(16,30,28,.06),0 8px 24px -16px rgba(16,30,28,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B1413; --surface:#111D1B; --surface-2:#162422;
    --ink:#E4EDEA; --muted:#93A69F; --rule:#233532; --rule-soft:#1B2A28;
    --accent:#63BCB4; --bar:#22A79C;
    --entrada:#3FA88F; --saida:#D06F44; --investimento:#9085E9;
    --alerta:#E08A5B; --grid:#2B3E3B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1413; --surface:#111D1B; --surface-2:#162422;
  --ink:#E4EDEA; --muted:#93A69F; --rule:#233532; --rule-soft:#1B2A28;
  --accent:#63BCB4; --bar:#22A79C;
  --entrada:#3FA88F; --saida:#D06F44; --investimento:#9085E9;
  --alerta:#E08A5B; --grid:#2B3E3B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Newsreader",Georgia,serif;font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.mono,code{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 72px}

header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;
  justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--rule)}
h1{font-family:"Archivo",system-ui,sans-serif;font-weight:700;font-size:1.75rem;
  letter-spacing:-.025em;margin:0}
.sub{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin:0 0 6px}
select{font-family:"IBM Plex Mono",monospace;font-size:13px;padding:7px 10px;
  border:1px solid var(--rule);border-radius:6px;background:var(--surface);
  color:var(--ink);cursor:pointer}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.kpis{display:grid;gap:12px;margin:24px 0 8px;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:9px;
  padding:16px 18px;box-shadow:var(--shadow)}
.kpi .lab{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.kpi .val{font-family:"Archivo",system-ui,sans-serif;font-weight:600;font-size:1.5rem;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .foot{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);margin-top:6px}
.val.in{color:var(--entrada)} .val.out{color:var(--saida)} .val.inv{color:var(--investimento)}

.cols{display:grid;gap:22px;margin-top:22px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
section.card{background:var(--surface);border:1px solid var(--rule);border-radius:9px;
  padding:20px 20px 16px;box-shadow:var(--shadow);margin-top:22px}
.cols section.card{margin-top:0}
h2{font-family:"Archivo",system-ui,sans-serif;font-weight:600;font-size:1.02rem;
  letter-spacing:-.01em;margin:0 0 4px}
.hint{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);margin:0 0 14px}
.chartbox{overflow-x:auto}
svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-family:"IBM Plex Mono",monospace;
  font-size:11.5px;color:var(--muted);margin:2px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}

.t-lab{font-family:"IBM Plex Mono",monospace;font-size:11.5px;fill:var(--ink)}
.t-ax{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:var(--muted)}
.t-val{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;fill:var(--ink)}
.gridline{stroke:var(--grid);stroke-width:1}
.hit{fill:transparent}

table{border-collapse:collapse;width:100%;font-size:.9rem}
.tablebox{overflow-x:auto}
table.wide{min-width:680px}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:9px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--rule-soft)}
tr:last-child td{border-bottom:none}
td.n,th.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  text-align:right;white-space:nowrap}
tfoot td{border-top:1px solid var(--rule);border-bottom:none;font-weight:600}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;border:1px solid currentColor;
  border-radius:999px;padding:1px 8px;white-space:nowrap}
.tag.in{color:var(--entrada)} .tag.out{color:var(--saida)} .tag.inv{color:var(--investimento)}
.pago{color:var(--entrada)} .aberto{color:var(--alerta)}
.vazio{color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:12px;padding:6px 0}

.faturas{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.fatura{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--surface-2)}
.fatura h3{font-family:"Archivo",system-ui,sans-serif;font-size:.88rem;font-weight:600;
  margin:0 0 2px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.fatura .tot{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.fatura .meta{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);margin-bottom:8px}
.fatura ul{list-style:none;margin:0;padding:0;font-size:.85rem}
.fatura li{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.fatura li span:last-child{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

.selbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted)}
.selbar button{font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:6px 12px;
  border:1px solid var(--rule);border-radius:6px;background:var(--surface);
  color:var(--ink);cursor:pointer}
.selbar button:hover:not(:disabled){border-color:var(--accent)}
.selbar button.perigo:not(:disabled){border-color:var(--saida);color:var(--saida)}
.selbar button:disabled{opacity:.4;cursor:default}
.selbar .recado{color:var(--alerta)}
.selbar .feito{color:var(--entrada)}
th.sel,td.sel{width:32px;padding-right:0}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;margin:0}
tr.marcada td{background:var(--surface-2)}

#tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--ink);color:var(--ground);font-family:"IBM Plex Mono",monospace;
  font-size:11.5px;line-height:1.5;padding:7px 10px;border-radius:5px;white-space:pre;
  transform:translate(-50%,-125%);z-index:20}
#status{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);
  padding:40px 0;text-align:center}
#status b{color:var(--saida)}
footer{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  margin-top:32px;padding-top:16px;border-top:1px solid var(--rule)}
</style>
</head>
<body>
<div id="tip"></div>
<div class="wrap">

  <header class="top">
    <div>
      <p class="sub">Controle de gastos</p>
      <h1>Gastos da Casa</h1>
    </div>
    <label>
      <span class="sub" style="display:block">Competência</span>
      <select id="mes"></select>
    </label>
  </header>

  <div id="status">carregando a planilha…</div>
  <div id="app" hidden>
    <div class="kpis" id="kpis"></div>
    <div id="secoes"></div>
    <footer id="rodape"></footer>
  </div>
</div>

<script>
// ─── AJUSTE AQUI ────────────────────────────────────────────────────────────
// Para cada aba: Arquivo > Compartilhar > Publicar na web > a aba > CSV.
// Só Lancamentos é obrigatória; sem as outras, as seções somem sozinhas.
const CSV = {
  lancamentos: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQQ4wOtYo2sdS04RYiadtaiiqgSmgt2H2DHHalljs-p8qLPJ7Fylgvpl-ve2r6mCOPYyplZMtyy-JoW/pub?gid=0&single=true&output=csv",
  cartoes:     "https://docs.google.com/spreadsheets/d/e/2PACX-1vQQ4wOtYo2sdS04RYiadtaiiqgSmgt2H2DHHalljs-p8qLPJ7Fylgvpl-ve2r6mCOPYyplZMtyy-JoW/pub?gid=129961328&single=true&output=csv",
  fixos:       "https://docs.google.com/spreadsheets/d/e/2PACX-1vQQ4wOtYo2sdS04RYiadtaiiqgSmgt2H2DHHalljs-p8qLPJ7Fylgvpl-ve2r6mCOPYyplZMtyy-JoW/pub?gid=1493976624&single=true&output=csv",
  dividas:     "https://docs.google.com/spreadsheets/d/e/2PACX-1vQQ4wOtYo2sdS04RYiadtaiiqgSmgt2H2DHHalljs-p8qLPJ7Fylgvpl-ve2r6mCOPYyplZMtyy-JoW/pub?gid=2010798044&single=true&output=csv",
  plr:         "https://docs.google.com/spreadsheets/d/e/2PACX-1vQQ4wOtYo2sdS04RYiadtaiiqgSmgt2H2DHHalljs-p8qLPJ7Fylgvpl-ve2r6mCOPYyplZMtyy-JoW/pub?gid=1867345037&single=true&output=csv",
};

// Apagar lançamentos daqui exige o webhook do n8n — uma página estática não tem
// como escrever na planilha sozinha. Deixe "" para esconder a seleção.
// O segredo NÃO mora aqui: ele é pedido uma vez e guardado no navegador.
const APAGAR = "https://n8n-financeiro-baimas.duckdns.org/webhook/apagar-lancamentos";
// ────────────────────────────────────────────────────────────────────────────

const brl  = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const brl2 = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const rotuloMes = c => { const [a,m]=String(c).split('-'); return MESES[+m-1]+'/'+String(a).slice(2); };
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// aceita 1234, 1234.56, "1.234,56" e "R$ 1.234,56"
function num(v){
  const s = String(v ?? '').replace(/[R$\s]/g,'').trim();
  if(!s) return 0;
  const limpo = s.includes(',') ? s.replace(/\./g,'').replace(',','.') : s;
  return parseFloat(limpo) || 0;
}

// CSV com aspas, vírgulas e quebras de linha dentro do campo
function parseCSV(txt){
  const rows=[]; let row=[], field='', q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){
      if(c==='"'){ if(txt[i+1]==='"'){ field+='"'; i++; } else q=false; }
      else field+=c;
    } else if(c==='"'){ q=true; }
    else if(c===','){ row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else if(c!=='\r'){ field+=c; }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim()!==''));
}
function paraObjetos(txt){
  const linhas = parseCSV(txt);
  if(!linhas.length) return [];
  const cab = linhas[0].map(h=>h.trim());
  return linhas.slice(1).map(l => Object.fromEntries(cab.map((c,i)=>[c,(l[i]??'').trim()])));
}

const tip=document.getElementById('tip');
function bindTip(el, texto){
  el.addEventListener('mousemove', e=>{
    tip.textContent=texto; tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.style.opacity='1';
  });
  el.addEventListener('mouseleave', ()=>{ tip.style.opacity='0'; });
}

const D = { lancamentos:[], cartoes:[], fixos:[], dividas:[], plr:[] };

// ─── seções ─────────────────────────────────────────────────────────────────
const cartao = (titulo, hint, corpo) =>
  `<section class="card"><h2>${titulo}</h2>${hint?`<p class="hint">${hint}</p>`:''}${corpo}</section>`;

function secaoFaturas(comp){
  if(!D.cartoes.length) return '';
  const blocos = D.cartoes.map(c=>{
    const itens = D.lancamentos.filter(l=>l.forma===c.nome && l.competencia_fatura===comp);
    const total = itens.reduce((a,l)=>a+l.valor,0);
    const porCat = {};
    itens.forEach(l=>{ porCat[l.categoria]=(porCat[l.categoria]||0)+l.valor; });
    const lista = Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
    return `<div class="fatura">
      <h3><span>${esc(c.nome)}</span><span class="tot">${esc(brl2(total))}</span></h3>
      <p class="meta">fecha dia ${esc(c.dia_fechamento||'?')} · vence dia ${esc(c.dia_vencimento||'?')}</p>
      <ul>${lista.length
        ? lista.map(([cat,v])=>`<li><span>${esc(cat)}</span><span>${esc(brl2(v))}</span></li>`).join('')
        : '<li class="vazio">nada nesta fatura</li>'}</ul></div>`;
  }).join('');
  const soma = D.lancamentos.filter(l=>l.competencia_fatura===comp).reduce((a,l)=>a+l.valor,0);
  return cartao('Cartões de crédito',
    `o que vence em ${rotuloMes(comp)} — total ${brl2(soma)}`,
    `<div class="faturas">${blocos}</div>`);
}

function secaoFixos(comp){
  if(!D.fixos.length) return '';
  const ativos = D.fixos.filter(f=>!['nao','não','0','false'].includes(String(f.ativo||'sim').toLowerCase()));
  if(!ativos.length) return '';
  const linhas = ativos.map(f=>{
    const pagos = D.lancamentos.filter(l=>l.fixo===f.nome && l.competencia===comp);
    const pago = pagos.reduce((a,l)=>a+l.valor,0);
    const previsto = num(f.valor);
    return {nome:f.nome, previsto, pago, quitado:pagos.length>0, dia:f.dia_vencimento};
  });
  const previsto = linhas.reduce((a,l)=>a+l.previsto,0);
  const pago = linhas.reduce((a,l)=>a+l.pago,0);
  const faltam = linhas.filter(l=>!l.quitado).length;
  return cartao('Gastos fixos',
    `${linhas.length-faltam} de ${linhas.length} pagos em ${rotuloMes(comp)}`,
    `<div class="tablebox"><table>
      <thead><tr><th>Conta</th><th>Vence</th><th class="n">Previsto</th><th class="n">Pago</th></tr></thead>
      <tbody>${linhas.map(l=>`<tr>
        <td>${esc(l.nome)}</td>
        <td class="mono">${l.dia?'dia '+esc(l.dia):'—'}</td>
        <td class="n">${esc(brl2(l.previsto))}</td>
        <td class="n ${l.quitado?'pago':'aberto'}">${l.quitado?esc(brl2(l.pago)):'em aberto'}</td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="2">Total</td><td class="n">${esc(brl2(previsto))}</td>
        <td class="n">${esc(brl2(pago))}</td></tr></tfoot>
    </table></div>`);
}

function secaoOrcamento(comp, itens){
  if(!D.cartoes.length && !D.fixos.length) return '';
  const cartoes = D.lancamentos.filter(l=>l.competencia_fatura===comp).reduce((a,l)=>a+l.valor,0);
  const ativos = D.fixos.filter(f=>!['nao','não','0','false'].includes(String(f.ativo||'sim').toLowerCase()));
  const fixos = ativos.reduce((a,f)=>a+num(f.valor),0);
  const inv = itens.filter(l=>l.tipo==='investimento').reduce((a,l)=>a+l.valor,0);
  const linhas = [['Cartões',cartoes],['Gastos fixos',fixos],['Investimentos',inv]];
  const total = linhas.reduce((a,[,v])=>a+v,0);
  return cartao('Orçamento do mês', 'o que sai da conta em '+rotuloMes(comp),
    `<table><tbody>${linhas.map(([n,v])=>
      `<tr><td>${n}</td><td class="n">${esc(brl2(v))}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td><td class="n">${esc(brl2(total))}</td></tr></tfoot></table>`);
}

function secaoDividas(){
  if(!D.dividas.length) return '';
  const linhas = D.dividas.map(d=>({nome:d.nome, saldo:num(d.saldo), quando:d.atualizado_em}))
    .filter(d=>d.saldo>0).sort((a,b)=>b.saldo-a.saldo);
  if(!linhas.length) return '';
  const total = linhas.reduce((a,d)=>a+d.saldo,0);
  const atualizado = linhas.map(d=>d.quando).filter(Boolean).sort().pop();
  return cartao('Dívidas', atualizado?`saldo devedor · atualizado em ${esc(atualizado)}`:'saldo devedor',
    `<table><tbody>${linhas.map(d=>
      `<tr><td>${esc(d.nome)}</td><td class="n">${esc(brl2(d.saldo))}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td><td class="n">${esc(brl2(total))}</td></tr></tfoot></table>`);
}

function secaoPLR(){
  if(!D.plr.length) return '';
  const total = D.plr.filter(p=>p.tipo==='total').reduce((a,p)=>a+num(p.valor),0);
  const saida = D.plr.filter(p=>p.tipo==='saida').reduce((a,p)=>a+num(p.valor),0);
  if(!total && !saida) return '';
  return cartao('PLR', 'fora do orçamento mensal',
    `<table><tbody>
      <tr><td>Recebido</td><td class="n">${esc(brl2(total))}</td></tr>
      <tr><td>Já usado</td><td class="n">${esc(brl2(saida))}</td></tr>
      </tbody><tfoot><tr><td>Restam</td><td class="n">${esc(brl2(total-saida))}</td></tr></tfoot></table>`);
}

function secaoCategorias(itens){
  return cartao('Para onde foi o dinheiro', 'saídas por categoria, maior primeiro',
    '<div class="chartbox"><svg id="cat" role="img"></svg></div>');
}

function graficoCategorias(itens){
  const svg=document.getElementById('cat');
  if(!svg) return;
  const porCat={};
  itens.filter(t=>t.tipo==='saida').forEach(t=>{ porCat[t.categoria]=(porCat[t.categoria]||0)+t.valor; });
  const lista=Object.entries(porCat).sort((a,b)=>b[1]-a[1]).slice(0,12);
  if(!lista.length){ svg.innerHTML=''; svg.removeAttribute('viewBox'); return; }
  const max=lista[0][1], L=160, R=100, W=760, H=lista.length*34+14, k=(W-L-R)/max;
  let s='';
  lista.forEach(([cat,v],i)=>{
    const y=i*34+8, w=Math.max(4, v*k), x1=L+w;
    s+=`<g><text class="t-lab" x="${L-12}" y="${y+17}" text-anchor="end">${esc(cat)}</text>`
     + `<path fill="var(--bar)" d="M${L} ${y} H${x1-4} A4 4 0 0 1 ${x1} ${y+4} V${y+20} A4 4 0 0 1 ${x1-4} ${y+24} H${L} Z"/>`
     + `<text class="t-val" x="${x1+10}" y="${y+17}">${esc(brl(v))}</text>`
     + `<rect class="hit" x="0" y="${y-3}" width="${W}" height="30" data-tip="${esc(cat)} — ${esc(brl2(v))}"/></g>`;
  });
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('aria-label','Saídas por categoria no mês selecionado');
  svg.innerHTML=s;
  svg.querySelectorAll('g').forEach(g=>bindTip(g,g.querySelector('.hit').dataset.tip));
}

function graficoHistorico(){
  const svg=document.getElementById('hist');
  if(!svg) return;
  const meses=[...new Set(D.lancamentos.map(t=>t.competencia))].sort().slice(-12);
  const agg=meses.map(c=>{
    const dd=D.lancamentos.filter(t=>t.competencia===c);
    const soma=tipo=>dd.filter(t=>t.tipo===tipo).reduce((a,t)=>a+t.valor,0);
    return { c, ent:soma('entrada'), sai:soma('saida'), inv:soma('investimento') };
  });
  const max=Math.max(1,...agg.map(m=>Math.max(m.ent,m.sai,m.inv)));
  const W=760,H=250,T=14,B=48,Lg=70, plotH=H-T-B, passo=(W-Lg-10)/agg.length;
  const eixo=v=> v>=1000 ? Math.round(v/1000)+' mil' : Math.round(v);
  const bw=Math.max(5,(passo-12)/3-1);
  let s='';
  for(let i=0;i<=4;i++){
    const y=T+plotH-plotH*i/4;
    s+=`<line class="gridline" x1="${Lg}" y1="${y}" x2="${W-6}" y2="${y}"/>`
     + `<text class="t-ax" x="${Lg-8}" y="${y+3}" text-anchor="end">${esc(eixo(max*i/4))}</text>`;
  }
  agg.forEach((m,i)=>{
    const x0=Lg+i*passo+6;
    // 2px de respiro entre barras vizinhas para elas nao se fundirem
    const barra=(x,v,cor)=>{ const h=v/max*plotH; return h<1 ? '' :
      `<path fill="${cor}" d="M${x} ${T+plotH} V${T+plotH-h+4} A4 4 0 0 1 ${x+4} ${T+plotH-h} H${x+bw-4} A4 4 0 0 1 ${x+bw} ${T+plotH-h+4} V${T+plotH} Z"/>`; };
    s+=`<g>${barra(x0,m.ent,'var(--entrada)')}${barra(x0+bw+2,m.sai,'var(--saida)')}${barra(x0+2*bw+4,m.inv,'var(--investimento)')}`
     + `<text class="t-ax" x="${x0+(3*bw+4)/2}" y="${H-B+22}" text-anchor="middle">${esc(rotuloMes(m.c))}</text>`
     + `<rect class="hit" x="${x0-4}" y="${T}" width="${passo}" height="${plotH+10}"`
     + ` data-tip="${esc(rotuloMes(m.c))}\nentradas      ${esc(brl2(m.ent))}\nsaídas        ${esc(brl2(m.sai))}\ninvestimentos ${esc(brl2(m.inv))}"/></g>`;
  });
  s+=`<line class="gridline" x1="${Lg}" y1="${T+plotH}" x2="${W-6}" y2="${T+plotH}"/>`;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('aria-label','Entradas, saídas e investimentos por mês nos últimos 12 meses');
  svg.innerHTML=s;
  svg.querySelectorAll('g').forEach(g=>bindTip(g,g.querySelector('.hit').dataset.tip));
}

// Só dá para apagar o que tem chave: lançamento gravado antes de existir a
// coluna criado_em fica na tabela, mas sem caixinha.
const podeApagar = t => Boolean(APAGAR && t.update_id && t.criado_em);

let tabelaAtual = [];          // o que está na tela, na ordem em que aparece
const marcadas = new Set();    // índices de tabelaAtual

function secaoTabela(itens){
  const ord=[...itens].sort((a,b)=> a.data<b.data?1:a.data>b.data?-1:0);
  tabelaAtual = ord;
  marcadas.clear();
  const comSelecao = APAGAR && ord.some(podeApagar);
  const cols = comSelecao ? 7 : 6;
  const corpo = ord.length ? ord.map((t,i)=>`
    <tr data-i="${i}">${comSelecao ? `<td class="sel">${podeApagar(t)
        ? `<input type="checkbox" data-i="${i}" aria-label="Selecionar ${esc(t.descricao||t.categoria)}">`
        : ''}</td>` : ''}
      <td class="mono">${esc(t.data.slice(8)+'/'+t.data.slice(5,7))}</td>
      <td><span class="tag ${t.tipo==='entrada'?'in':t.tipo==='investimento'?'inv':'out'}">${esc(t.categoria)}</span></td>
      <td>${esc(t.descricao||'—')}</td>
      <td class="mono">${esc(t.forma&&t.forma!=='Não informado'?t.forma:'—')}</td>
      <td class="mono">${esc(t.pessoa||'—')}</td>
      <td class="n">${esc(brl2(t.valor))}</td></tr>`).join('')
    : `<tr><td colspan="${cols}" class="vazio">nada lançado neste mês ainda</td></tr>`;
  const barra = comSelecao ? `<div class="selbar" id="selbar">
      <span id="selconta">nenhum selecionado</span>
      <button type="button" id="apagar" class="perigo" disabled>Apagar selecionados</button>
      <span id="selrecado"></span></div>` : '';
  return cartao('Lançamentos do mês', `${ord.length} lançamento(s), do mais recente para o mais antigo`,
    barra + `<div class="tablebox"><table class="wide">
      <thead><tr>${comSelecao?'<th class="sel"></th>':''}<th>Data</th><th>Categoria</th><th>Descrição</th><th>Como</th><th>Quem</th><th class="n">Valor</th></tr></thead>
      <tbody>${corpo}</tbody></table></div>`);
}

// ─── apagar ─────────────────────────────────────────────────────────────────
function atualizarBarra(){
  const conta=document.getElementById('selconta'), bt=document.getElementById('apagar');
  if(!conta||!bt) return;
  const soma=[...marcadas].reduce((a,i)=>a+(tabelaAtual[i]?.valor||0),0);
  conta.textContent = marcadas.size
    ? `${marcadas.size} selecionado(s) · ${brl2(soma)}`
    : 'nenhum selecionado';
  bt.disabled = !marcadas.size;
}

function recado(texto, classe=''){
  const el=document.getElementById('selrecado');
  if(el){ el.className=classe; el.textContent=texto; }
}

// O segredo fica no navegador de quem usa, nunca neste arquivo — que é público.
function pegarSegredo(forcar){
  let t = forcar ? '' : (localStorage.getItem('apagar-token')||'');
  if(!t){
    t = (prompt('Segredo para apagar lançamentos (fica guardado neste navegador):')||'').trim();
    if(t) localStorage.setItem('apagar-token', t);
  }
  return t;
}

async function apagarSelecionados(){
  const escolhidos=[...marcadas].map(i=>tabelaAtual[i]).filter(Boolean);
  if(!escolhidos.length) return;
  const soma=escolhidos.reduce((a,t)=>a+t.valor,0);
  if(!confirm(`Apagar ${escolhidos.length} lançamento(s), somando ${brl2(soma)}?\n\n`
    +'As linhas saem da planilha e não há como desfazer.')) return;
  const segredo=pegarSegredo(false);
  if(!segredo) return;

  const bt=document.getElementById('apagar');
  if(bt) bt.disabled=true;
  recado('apagando…');
  try{
    const r=await fetch(APAGAR,{
      method:'POST',
      headers:{'Content-Type':'application/json','x-dashboard-token':segredo},
      body:JSON.stringify({chaves:escolhidos.map(t=>({
        update_id:t.update_id, criado_em:t.criado_em, valor:t.valor, descricao:t.descricao,
      }))}),
    });
    const resp=await r.json().catch(()=>({}));
    if(r.status===401){
      localStorage.removeItem('apagar-token');
      recado('segredo recusado — clique de novo para digitar outro','recado');
      atualizarBarra();
      return;
    }
    if(!r.ok||!resp.ok) throw new Error(resp.motivo||`o n8n respondeu ${r.status}`);

    // Some da tela na hora: o CSV publicado só reflete a exclusão minutos depois
    const foram=new Set((resp.apagadas||[]).map(a=>a.update_id+'|'+a.criado_em));
    D.lancamentos=D.lancamentos.filter(t=>!foram.has(t.update_id+'|'+t.criado_em));
    render();
    const sobraram=(resp.nao_encontrados||[]).length;
    recado(`${resp.apagados} apagado(s)`
      + (sobraram?` · ${sobraram} não encontrado(s) na planilha`:'')
      + ' · a planilha publicada leva alguns minutos para refletir',
      sobraram?'recado':'feito');
  }catch(e){
    recado('não deu: '+e.message,'recado');
    atualizarBarra();
  }
}

// ─── render ─────────────────────────────────────────────────────────────────
function render(){
  const comp=document.getElementById('mes').value;
  const itens=D.lancamentos.filter(t=>t.competencia===comp);
  const soma=tipo=>itens.filter(t=>t.tipo===tipo).reduce((a,t)=>a+t.valor,0);
  const ent=soma('entrada'), sai=soma('saida'), inv=soma('investimento');
  const saldo=ent-sai-inv;

  const hoje=new Date();
  const compAtual=hoje.toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'}).slice(0,7);
  let quarto;
  if(comp===compAtual){
    const fim=new Date(hoje.getFullYear(),hoje.getMonth()+1,0).getDate();
    const restam=Math.max(1,fim-hoje.getDate()+1);
    quarto=`<div class="kpi"><div class="lab">Disponível por dia</div>
      <div class="val">${saldo>0?brl(saldo/restam):brl(0)}</div>
      <div class="foot">${restam} dia(s) até o fim do mês</div></div>`;
  } else {
    quarto=`<div class="kpi"><div class="lab">Lançamentos</div>
      <div class="val">${itens.length}</div><div class="foot">no mês selecionado</div></div>`;
  }

  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><div class="lab">Entradas</div><div class="val in">${brl(ent)}</div>
      <div class="foot">${itens.filter(t=>t.tipo==='entrada').length} lançamento(s)</div></div>
    <div class="kpi"><div class="lab">Saídas</div><div class="val out">${brl(sai)}</div>
      <div class="foot">${itens.filter(t=>t.tipo==='saida').length} lançamento(s)</div></div>
    <div class="kpi"><div class="lab">Investimentos</div><div class="val inv">${brl(inv)}</div>
      <div class="foot">${itens.filter(t=>t.tipo==='investimento').length} aporte(s)</div></div>
    <div class="kpi"><div class="lab">Saldo</div>
      <div class="val ${saldo<0?'out':'in'}">${brl(saldo)}</div>
      <div class="foot">${ent>0?'poupança de '+((saldo/ent)*100).toFixed(0)+'%':'sem entrada registrada'}</div></div>
    ${quarto}`;

  document.getElementById('secoes').innerHTML =
      secaoFaturas(comp)
    + `<div class="cols">${secaoOrcamento(comp,itens)}${secaoFixos(comp)}</div>`
    + secaoCategorias(itens)
    + `<div class="cols">${secaoDividas()}${secaoPLR()}</div>`
    + cartao('Últimos 12 meses','',
        `<div class="legend">
          <span><i style="background:var(--entrada)"></i>entradas</span>
          <span><i style="background:var(--saida)"></i>saídas</span>
          <span><i style="background:var(--investimento)"></i>investimentos</span>
        </div><div class="chartbox"><svg id="hist" role="img"></svg></div>`)
    + secaoTabela(itens);

  graficoCategorias(itens);
  graficoHistorico();
  ligarSelecao();
}

// A tabela é recriada a cada render, então os eventos são religados aqui.
function ligarSelecao(){
  const bt=document.getElementById('apagar');
  if(!bt) return;
  document.querySelectorAll('#secoes input[type=checkbox][data-i]').forEach(cx=>{
    cx.addEventListener('change',()=>{
      const i=Number(cx.dataset.i);
      if(cx.checked) marcadas.add(i); else marcadas.delete(i);
      cx.closest('tr')?.classList.toggle('marcada',cx.checked);
      recado('');
      atualizarBarra();
    });
  });
  bt.addEventListener('click',apagarSelecionados);
  atualizarBarra();
}

// ─── carga ──────────────────────────────────────────────────────────────────
async function baixar(url){
  if(!url || url.startsWith('COLE_AQUI')) return null;
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return paraObjetos(await r.text());
}

async function carregar(){
  const st=document.getElementById('status');
  if(!CSV.lancamentos || CSV.lancamentos.startsWith('COLE_AQUI')){
    st.innerHTML='<b>Falta configurar.</b> Abra este arquivo e cole a URL do CSV publicado em CSV.lancamentos.';
    return;
  }
  try{
    const [lanc, cart, fix, div, plr] = await Promise.all([
      baixar(CSV.lancamentos),
      baixar(CSV.cartoes).catch(()=>null),
      baixar(CSV.fixos).catch(()=>null),
      baixar(CSV.dividas).catch(()=>null),
      baixar(CSV.plr).catch(()=>null),
    ]);

    D.lancamentos = (lanc||[]).map(l=>({
      // update_id + criado_em identificam a linha na planilha; sem eles não há
      // como apagar sem depender da posição, que o CSV mostra com atraso
      update_id: String(l.update_id??'').trim(),
      criado_em: String(l.criado_em??'').trim(),
      data: l.data||'',
      competencia: l.competencia || (l.data||'').slice(0,7),
      competencia_fatura: l.competencia_fatura||'',
      tipo: l.tipo||'saida',
      valor: num(l.valor),
      categoria: l.categoria||'Outros',
      forma: l.forma||'',
      descricao: l.descricao||'',
      pessoa: l.pessoa||'',
      fixo: l.fixo||'',
    })).filter(t=>t.competencia && t.valor>0);

    D.cartoes  = cart||[];
    D.fixos    = fix||[];
    D.dividas  = div||[];
    D.plr      = plr||[];

    if(!D.lancamentos.length){ st.textContent='A planilha está vazia — mande o primeiro gasto no grupo.'; return; }

    const meses=[...new Set(D.lancamentos.map(t=>t.competencia))].sort().reverse();
    const sel=document.getElementById('mes');
    sel.innerHTML=meses.map(c=>`<option value="${c}">${rotuloMes(c)}</option>`).join('');
    sel.addEventListener('change',render);

    st.hidden=true; document.getElementById('app').hidden=false;
    const abas=[['cartões',D.cartoes],['fixos',D.fixos],['dívidas',D.dividas],['PLR',D.plr]]
      .filter(([,v])=>v.length).map(([n])=>n);
    document.getElementById('rodape').textContent =
      `${D.lancamentos.length} lançamentos`
      + (abas.length?` · abas: ${abas.join(', ')}`:'')
      + ` · atualizado em ${new Date().toLocaleString('pt-BR')}`;
    render();
  }catch(e){
    st.innerHTML='<b>Não consegui ler a planilha.</b><br>Confirme que ela está publicada na web como CSV e que a URL está correta.<br><br>'+esc(e.message);
  }
}
carregar();
</script>
