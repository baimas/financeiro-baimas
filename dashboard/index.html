<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gastos da Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EFF2F0; --surface:#FFFFFF; --surface-2:#E7ECE9;
  --ink:#101E1C; --muted:#556660; --rule:#D3DBD7; --rule-soft:#E1E7E4;
  --accent:#0E4C51; --bar:#0E9AA0; --entrada:#1B8F7A; --saida:#C25A2E;
  --grid:#C9D3CE;
  --shadow:0 1px 2px rgba(16,30,28,.06),0 8px 24px -16px rgba(16,30,28,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B1413; --surface:#111D1B; --surface-2:#162422;
    --ink:#E4EDEA; --muted:#93A69F; --rule:#233532; --rule-soft:#1B2A28;
    --accent:#63BCB4; --bar:#22A79C; --entrada:#3FA88F; --saida:#D06F44;
    --grid:#2B3E3B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Newsreader",Georgia,serif;font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.mono,code{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.wrap{max-width:1060px;margin:0 auto;padding:28px 20px 72px}

header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;
  justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--rule)}
h1{font-family:"Archivo",system-ui,sans-serif;font-weight:700;font-size:1.75rem;
  letter-spacing:-.025em;margin:0}
.sub{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin:0 0 6px}
select{font-family:"IBM Plex Mono",monospace;font-size:13px;padding:7px 10px;
  border:1px solid var(--rule);border-radius:6px;background:var(--surface);
  color:var(--ink);cursor:pointer}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.kpis{display:grid;gap:12px;margin:24px 0 8px;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:9px;
  padding:16px 18px;box-shadow:var(--shadow)}
.kpi .lab{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.kpi .val{font-family:"Archivo",system-ui,sans-serif;font-weight:600;font-size:1.6rem;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .foot{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);margin-top:6px}
.val.in{color:var(--entrada)} .val.out{color:var(--saida)}

section.card{background:var(--surface);border:1px solid var(--rule);border-radius:9px;
  padding:20px 20px 14px;box-shadow:var(--shadow);margin-top:22px;position:relative}
h2{font-family:"Archivo",system-ui,sans-serif;font-weight:600;font-size:1.02rem;
  letter-spacing:-.01em;margin:0 0 4px}
.hint{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);margin:0 0 14px}
.chartbox{overflow-x:auto}
svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  color:var(--muted);margin:2px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;
  vertical-align:baseline}

.t-lab{font-family:"IBM Plex Mono",monospace;font-size:11.5px;fill:var(--ink)}
.t-ax{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:var(--muted)}
.t-val{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;fill:var(--ink)}
.gridline{stroke:var(--grid);stroke-width:1}
.hit{fill:transparent}

table{border-collapse:collapse;width:100%;min-width:640px;font-size:.9rem}
.tablebox{overflow-x:auto}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--rule-soft)}
tr:last-child td{border-bottom:none}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  text-align:right;white-space:nowrap}
th.n{text-align:right}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;border:1px solid currentColor;
  border-radius:999px;padding:1px 8px}
.tag.in{color:var(--entrada)} .tag.out{color:var(--saida)}

#tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--ink);color:var(--ground);font-family:"IBM Plex Mono",monospace;
  font-size:11.5px;line-height:1.5;padding:7px 10px;border-radius:5px;white-space:pre;
  transform:translate(-50%,-125%);z-index:20}
#status{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);
  padding:40px 0;text-align:center}
#status b{color:var(--saida)}
footer{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  margin-top:32px;padding-top:16px;border-top:1px solid var(--rule)}
</style>
</head>
<body>
<div id="tip"></div>
<div class="wrap">

  <header class="top">
    <div>
      <p class="sub">Controle de gastos</p>
      <h1>Gastos da Casa</h1>
    </div>
    <label>
      <span class="sub" style="display:block">Competência</span>
      <select id="mes"></select>
    </label>
  </header>

  <div id="status">carregando a planilha…</div>
  <div id="app" hidden>
    <div class="kpis" id="kpis"></div>

    <section class="card">
      <h2>Para onde foi o dinheiro</h2>
      <p class="hint" id="cat-hint"></p>
      <div class="chartbox"><svg id="cat" role="img"></svg></div>
    </section>

    <section class="card">
      <h2>Últimos 12 meses</h2>
      <div class="legend">
        <span><i style="background:var(--entrada)"></i>entradas</span>
        <span><i style="background:var(--saida)"></i>saídas</span>
      </div>
      <div class="chartbox"><svg id="hist" role="img"></svg></div>
    </section>

    <section class="card">
      <h2>Lançamentos do mês</h2>
      <p class="hint" id="tab-hint"></p>
      <div class="tablebox"><table>
        <thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th>Quem</th><th class="n">Valor</th></tr></thead>
        <tbody id="linhas"></tbody>
      </table></div>
    </section>

    <footer id="rodape"></footer>
  </div>
</div>

<script>
// ─── AJUSTE AQUI ────────────────────────────────────────────────────────────
// Planilha > Arquivo > Compartilhar > Publicar na web > aba Lancamentos > CSV
const CSV_URL = "COLE_AQUI_A_URL_CSV_PUBLICADA";
// ────────────────────────────────────────────────────────────────────────────

const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const brl2 = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const rotuloMes = c => { const [a,m]=c.split('-'); return MESES[+m-1]+'/'+a.slice(2); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// CSV com aspas, vírgulas e quebras de linha dentro do campo
function parseCSV(txt){
  const rows=[]; let row=[], field='', q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){
      if(c==='"'){ if(txt[i+1]==='"'){ field+='"'; i++; } else q=false; }
      else field+=c;
    } else if(c==='"'){ q=true; }
    else if(c===','){ row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else if(c!=='\r'){ field+=c; }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim()!==''));
}

const tip=document.getElementById('tip');
function bindTip(el, texto){
  el.addEventListener('mousemove', e=>{
    tip.textContent=texto; tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.style.opacity='1';
  });
  el.addEventListener('mouseleave', ()=>{ tip.style.opacity='0'; });
}

let DADOS=[];

function graficoCategorias(itens){
  const svg=document.getElementById('cat');
  const porCat={};
  itens.filter(t=>t.tipo==='saida').forEach(t=>{ porCat[t.categoria]=(porCat[t.categoria]||0)+t.valor; });
  const lista=Object.entries(porCat).sort((a,b)=>b[1]-a[1]).slice(0,10);
  document.getElementById('cat-hint').textContent =
    lista.length ? 'saídas por categoria, maior primeiro' : 'nenhuma saída neste mês';
  if(!lista.length){ svg.innerHTML=''; svg.removeAttribute('viewBox'); return; }

  const max=lista[0][1], L=150, R=90, W=720, H=lista.length*38+16, esc_=(W-L-R)/max;
  let s='';
  lista.forEach(([cat,v],i)=>{
    const y=i*38+8, w=Math.max(4, v*esc_), x1=L+w;
    s+=`<g><text class="t-lab" x="${L-12}" y="${y+19}" text-anchor="end">${esc(cat)}</text>`
     + `<path fill="var(--bar)" d="M${L} ${y} H${x1-4} A4 4 0 0 1 ${x1} ${y+4} V${y+22} A4 4 0 0 1 ${x1-4} ${y+26} H${L} Z"/>`
     + `<text class="t-val" x="${x1+10}" y="${y+19}">${esc(brl(v))}</text>`
     + `<rect class="hit" x="0" y="${y-4}" width="${W}" height="34" data-tip="${esc(cat)} — ${esc(brl2(v))}"/></g>`;
  });
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('aria-label','Saídas por categoria no mês selecionado');
  svg.innerHTML=s;
  svg.querySelectorAll('g').forEach(g=>bindTip(g,g.querySelector('.hit').dataset.tip));
}

function graficoHistorico(){
  const svg=document.getElementById('hist');
  const meses=[...new Set(DADOS.map(t=>t.competencia))].sort().slice(-12);
  const agg=meses.map(c=>{
    const dd=DADOS.filter(t=>t.competencia===c);
    return { c,
      ent: dd.filter(t=>t.tipo==='entrada').reduce((a,t)=>a+t.valor,0),
      sai: dd.filter(t=>t.tipo==='saida').reduce((a,t)=>a+t.valor,0) };
  });
  const max=Math.max(1,...agg.map(m=>Math.max(m.ent,m.sai)));
  const W=720,H=250,T=14,B=48,Lg=66, plotH=H-T-B, passo=(W-Lg-10)/agg.length;
  const eixo=v=> v>=1000 ? Math.round(v/1000)+' mil' : Math.round(v);
  const bw=Math.max(6,(passo-10)/2-1);
  let s='';
  for(let i=0;i<=4;i++){
    const y=T+plotH-plotH*i/4;
    s+=`<line class="gridline" x1="${Lg}" y1="${y}" x2="${W-6}" y2="${y}"/>`
     + `<text class="t-ax" x="${Lg-8}" y="${y+3}" text-anchor="end">${esc(eixo(max*i/4))}</text>`;
  }
  agg.forEach((m,i)=>{
    const x0=Lg+i*passo+6;
    const hE=m.ent/max*plotH, hS=m.sai/max*plotH;
    const r=(x,h,cor)=> h<1 ? '' :
      `<path fill="${cor}" d="M${x} ${T+plotH} V${T+plotH-h+4} A4 4 0 0 1 ${x+4} ${T+plotH-h} H${x+bw-4} A4 4 0 0 1 ${x+bw} ${T+plotH-h+4} V${T+plotH} Z"/>`;
    s+=`<g>${r(x0,hE,'var(--entrada)')}${r(x0+bw+2,hS,'var(--saida)')}`
     + `<text class="t-ax" x="${x0+bw+1}" y="${H-B+22}" text-anchor="middle">${esc(rotuloMes(m.c))}</text>`
     + `<rect class="hit" x="${x0-4}" y="${T}" width="${passo}" height="${plotH+10}"`
     + ` data-tip="${esc(rotuloMes(m.c))}\nentradas ${esc(brl2(m.ent))}\nsaídas   ${esc(brl2(m.sai))}"/></g>`;
  });
  s+=`<line class="gridline" x1="${Lg}" y1="${T+plotH}" x2="${W-6}" y2="${T+plotH}"/>`;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('aria-label','Entradas e saídas por mês nos últimos 12 meses');
  svg.innerHTML=s;
  svg.querySelectorAll('g').forEach(g=>bindTip(g,g.querySelector('.hit').dataset.tip));
}

function render(){
  const comp=document.getElementById('mes').value;
  const itens=DADOS.filter(t=>t.competencia===comp);
  const ent=itens.filter(t=>t.tipo==='entrada').reduce((a,t)=>a+t.valor,0);
  const sai=itens.filter(t=>t.tipo==='saida').reduce((a,t)=>a+t.valor,0);
  const saldo=ent-sai;
  const taxa=ent>0 ? saldo/ent*100 : null;

  const hoje=new Date();
  const compAtual=hoje.toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'}).slice(0,7);
  let quarto='';
  if(comp===compAtual){
    const fim=new Date(hoje.getFullYear(),hoje.getMonth()+1,0).getDate();
    const restam=Math.max(1,fim-hoje.getDate()+1);
    quarto=`<div class="kpi"><div class="lab">Disponível por dia</div>
      <div class="val">${saldo>0?brl(saldo/restam):brl(0)}</div>
      <div class="foot">${restam} dia(s) até o fim do mês</div></div>`;
  } else {
    quarto=`<div class="kpi"><div class="lab">Lançamentos</div>
      <div class="val">${itens.length}</div>
      <div class="foot">no mês selecionado</div></div>`;
  }

  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><div class="lab">Entradas</div><div class="val in">${brl(ent)}</div>
      <div class="foot">${itens.filter(t=>t.tipo==='entrada').length} lançamento(s)</div></div>
    <div class="kpi"><div class="lab">Saídas</div><div class="val out">${brl(sai)}</div>
      <div class="foot">${itens.filter(t=>t.tipo==='saida').length} lançamento(s)</div></div>
    <div class="kpi"><div class="lab">Saldo</div>
      <div class="val ${saldo<0?'out':'in'}">${brl(saldo)}</div>
      <div class="foot">${taxa===null?'sem entrada registrada':'poupança de '+taxa.toFixed(0)+'%'}</div></div>
    ${quarto}`;

  graficoCategorias(itens);

  const ord=[...itens].sort((a,b)=> a.data<b.data?1:a.data>b.data?-1:0);
  document.getElementById('tab-hint').textContent=`${ord.length} lançamento(s), do mais recente para o mais antigo`;
  document.getElementById('linhas').innerHTML = ord.map(t=>`
    <tr><td class="mono">${esc(t.data.slice(8)+'/'+t.data.slice(5,7))}</td>
      <td><span class="tag ${t.tipo==='entrada'?'in':'out'}">${esc(t.categoria)}</span></td>
      <td>${esc(t.descricao||'—')}</td>
      <td class="mono">${esc(t.pessoa||'—')}</td>
      <td class="n">${esc(brl2(t.valor))}</td></tr>`).join('')
    || '<tr><td colspan="5" style="color:var(--muted)">nada lançado neste mês ainda</td></tr>';
}

async function carregar(){
  const st=document.getElementById('status');
  if(CSV_URL.startsWith('COLE_AQUI')){
    st.innerHTML='<b>Falta configurar.</b> Abra este arquivo e cole a URL do CSV publicado na constante CSV_URL.';
    return;
  }
  try{
    const r=await fetch(CSV_URL,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const linhas=parseCSV(await r.text());
    const head=linhas[0].map(h=>h.trim());
    const idx=n=>head.indexOf(n);
    DADOS=linhas.slice(1).map(l=>({
      data:(l[idx('data')]||'').trim(),
      competencia:(l[idx('competencia')]||'').trim() || (l[idx('data')]||'').trim().slice(0,7),
      tipo:(l[idx('tipo')]||'saida').trim(),
      valor:parseFloat(String(l[idx('valor')]||'0').replace(/\./g,'.').replace(',','.'))||0,
      categoria:(l[idx('categoria')]||'Outros').trim(),
      descricao:(l[idx('descricao')]||'').trim(),
      pessoa:(l[idx('pessoa')]||'').trim()
    })).filter(t=>t.competencia && t.valor>0);

    if(!DADOS.length){ st.textContent='A planilha está vazia — mande o primeiro gasto no grupo.'; return; }

    const meses=[...new Set(DADOS.map(t=>t.competencia))].sort().reverse();
    const sel=document.getElementById('mes');
    sel.innerHTML=meses.map(c=>`<option value="${c}">${rotuloMes(c)}</option>`).join('');
    sel.addEventListener('change',render);

    st.hidden=true; document.getElementById('app').hidden=false;
    document.getElementById('rodape').textContent =
      `${DADOS.length} lançamentos · atualizado em ${new Date().toLocaleString('pt-BR')}`;
    graficoHistorico(); render();
  }catch(e){
    st.innerHTML='<b>Não consegui ler a planilha.</b><br>Confirme que ela está publicada na web como CSV e que a URL está correta.<br><br>'+esc(e.message);
  }
}
carregar();
</script>
</body>
</html>
